[project]
name = "polywatch"
version = "0.0.1"
description = "Skill-vs-luck analytics for Polymarket wallets, and a copy-trading bot built on it."
requires-python = ">=3.11"
dependencies = []

# Live trading only. Paper mode, ingestion and every analytic run on the standard library
# alone, which is what keeps "does this program spend money" answerable by looking at whether
# this extra is installed.
[project.optional-dependencies]
live = ["py-clob-client>=0.17"]
# Streamed order books, so the exit ladder runs on every book update rather than once per poll.
# Separate from `live` on purpose: streaming reads, it never signs, so paper runs benefit from it
# and installing it says nothing about whether this program can spend money.
stream = ["websocket-client>=1.7"]

[project.scripts]
polywatch = "polywatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polywatch"]

[dependency-groups]
dev = ["pytest>=8"]
