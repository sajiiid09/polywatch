[project]
name = "polywatch"
version = "0.0.1"
description = "Read-only skill-vs-luck analytics for Polymarket wallets. Never trades."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
polywatch = "polywatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polywatch"]

[dependency-groups]
dev = ["pytest>=8"]
